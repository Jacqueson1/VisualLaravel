<!doctype html>
<html lang="en">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How Laravel creates a post</title>
</head>

<body>
  <main class="app">
    <header>
      <h1 id="lesson-title"></h1>
      <p class="tagline" id="tagline"></p>
    </header>
    <nav id="lessons" aria-label="Lessons"></nav>

    <div id="stats" class="stats"></div>
    <section id="scene"></section>
    <nav id="dots"></nav>

    <section class="lesson">
      <div class="text">
        <h2 id="title"></h2>
        <p id="caption" aria-live="polite"></p>
      </div>
      <div class="code">
        <div id="file"></div>
        <pre><code id="code"></code></pre>
      </div>
    </section>

    <footer>
      <button id="back">Back</button>
      <button id="next">Next</button>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
